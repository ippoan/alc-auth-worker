# 機械用資格情報 (と、後でログイン) の内部口の Worker (Refs ohishi-exp/rust-leave-worker#1)。
# 型は ippoan/rust-leave-worker・ippoan/alc-vein-worker と同じ。
# 直下の package が worker、route の crate は crates/auth (同じ workspace・lock は直下の 1 つ)。
#
# 口と検証は crates/auth に在り、この Worker が持つのは DB への経路 (`src/db.rs`) と workers-rs への載せ方 (`src/lib.rs`) だけ。
[package]
name = "alc-auth-worker"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[workspace]
members = ["crates/auth"]

# alc-core-wasm と alc-worker-db は ippoan/alc-worker-kit から引く。git 依存・rev 固定で、**2 つとも同じ rev**
# (ippoan/rust-leave-worker・ippoan/alc-vein-worker と同じ rev)。**書くのはここ 1 か所だけ** (worker と crates/auth は
# `workspace = true` で継承する)。出どころが 2 つになると `TenantId` (alc-core-wasm)・`PgClient` (alc-worker-db) が
# 別の型になり、コンパイルは通るのに全リクエストが 500 になる。rev を上げるときは 2 つを一緒に上げ、Cargo.lock も一緒に更新する。
# alc-core-wasm (tenant ヘッダーの layer) は、いまの内部口 (tenant は body / query で受ける) では使わない
# (ログインの口を移すときに使う。使わない間は Cargo.lock に載らない)。
[workspace.dependencies]
alc-core-wasm = { git = "https://github.com/ippoan/alc-worker-kit", rev = "a256d2a84682d375dc649d3c4e0e2e91d38c17c2" }
alc-worker-db = { git = "https://github.com/ippoan/alc-worker-kit", rev = "a256d2a84682d375dc649d3c4e0e2e91d38c17c2", features = ["chrono"] }
# RLS の検査 (`/internal/rls-check`) が流す問い合わせ・検査の題・期待する状態・埋め込まれた migration の一覧。
# git 依存・rev 固定で、書くのはここ 1 か所だけ。応答の migrations.binary_* と drift の比べる相手になるので、
# alc-migrations の main に merge され本番に流した rev に上げる (テストの DB の版 scripts/ALC_MIGRATIONS_REV とは別)
alc-migrations = { git = "https://github.com/ippoan/alc-migrations", rev = "d8cde0068f524afd5723212c53e458c8840774a9" }

# 使わない依存は入れない
[dependencies]
alc-worker-db = { workspace = true }
auth = { path = "crates/auth" }
axum = { version = "0.8", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["js"] }
tower-service = "0.3"
wasm-bindgen-futures = "0.4"
worker = { version = "0.8", features = ["http", "axum", "tokio-postgres"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
