# 機械用資格情報 (と、後でログイン) の内部口の Worker (Refs ohishi-exp/rust-leave-worker#1)。
# 型は ippoan/rust-leave-worker・ippoan/alc-vein-worker と同じ。
#
# ★ この Worker の口は全部 `/internal/…` で、共有 secret (X-Internal-Shared-Secret) で守る。
#   到達経路は auth-worker からの Service Binding だけにする:
#   - workers_dev = false / preview_urls = false (*.workers.dev と preview URL を開けない)
#   - route / routes / custom_domain を書かない
#   本番・staging とも workers.dev を開けない (どの env も workers_dev / preview_urls を false にする)。
#   scripts/check-exposure.sh が CI で毎回これを検査する。
# ★ 表の順を変えない・前の方に表を足さない (scripts/check-exposure-test.sh の陰性対照は、特定の表の
#   直前に行を挿して崩す作り。CLAUDE.md)。新しい表は placement の表より後に置く。
name = "alc-auth-worker"
main = "build/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[build]
command = "cargo install -q worker-build@0.8.7 && worker-build --release"

# 応答ヘッダー x-worker-version / x-worker-tag の元 (src/lib.rs)。binding は env に継承されないので
# トップレベルと env.staging の両方に要る。tag / message は deploy の --tag / --message (deploy.yml)
[version_metadata]
binding = "CF_VERSION_METADATA"

# 本番の DB は aws:ap-northeast-1。Worker をその近くで動かす
[placement]
region = "aws:ap-northeast-1"

# 本番でもログを残す (env に継承されないので、staging は下で別に書く)。口が出すログは固定の語と kind だけ
[observability]
enabled = true

# 本番の DB: Cloudflare Hyperdrive の binding AUTH_HYPERDRIVE (src/db.rs)。設定は実行用ロールのもの 1 つを
# 複数の worker で共有する (worker ごとに作らない。id は ippoan/rust-leave-worker・ippoan/alc-vein-worker と同じ)。
# 接続先・資格情報・TLS は設定の側に在り、ここに書くのは設定の ID だけ。
# env.staging / env.local には置かない (binding は env に継承されない。scripts/check-exposure.sh が検査する)。
[[hyperdrive]]
binding = "AUTH_HYPERDRIVE"
id = "6bdf446634034f989d4e094d5510b162"

# 内部口の共有 secret。ippoan/rust-leave-worker・ippoan/email-receiver の wrangler.toml と同じ Secrets Store の
# secret (値は repo に無い。worker では `.get()` で実値にする)。binding は env に継承されないので staging にも書く
[[secrets_store_secrets]]
binding = "INTERNAL_SHARED_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "INTERNAL_SHARED_SECRET"

# staging: DB は別 Worker alc-staging-db-staging (ippoan/alc-staging-db) の Durable Object StagingDb の中の PGlite
# (binding STAGING_DB。src/db.rs)。Hyperdrive は通さない。
[env.staging]
name = "alc-auth-worker-staging"
workers_dev = false
preview_urls = false

[env.staging.observability]
enabled = true

# staging の DB: 別 Worker alc-staging-db-staging の Durable Object (class はあちらの Worker のもの。migrations は要らない)。
# script_name の完全一致 1 件だけを scripts/check-exposure.sh が許す。トップレベル (本番) には置かない
[[env.staging.durable_objects.bindings]]
name = "STAGING_DB"
class_name = "StagingDb"
script_name = "alc-staging-db-staging"

[env.staging.version_metadata]
binding = "CF_VERSION_METADATA"

# Worker の実行場所を staging の DB の近くに寄せる (ippoan/rust-leave-worker の staging と同じ region)
[env.staging.placement]
region = "aws:ap-northeast-3"

[[env.staging.secrets_store_secrets]]
binding = "INTERNAL_SHARED_SECRET"
store_id = "bd7bc91a3e5f4111add4acf6cb4b8733"
secret_name = "INTERNAL_SHARED_SECRET"

# Google の初回ログインで、招待も email_domain の一致も無いときに会社を作る (crates/auth の login)。
# staging だけ (トップレベル・ほかの env には置かない。scripts/check-exposure.sh が検査する)。
# DB が Hyperdrive の段 (本番) なのにこれが有効なら、worker は全部の口を 500 にする (src/lib.rs)
[env.staging.vars]
STAGING_MODE = "1"

# ローカル (`wrangler dev --env local`) 専用。deploy しない。
# binding を持たない (binding は env に継承されない) ので、src/db.rs は文字列 DATABASE_URL の段で繋ぐ
[env.local]
name = "alc-auth-worker-local"
workers_dev = false
preview_urls = false
